{% extends 'base.html' %}
{% block conteudo %}

<form action="{{ url_for('residuo.add') }}" method="POST" class="mt-5 card mx-auto max-w-xl border border-base-300 bg-base-100 shadow-sm">
 <div class="card-body gap-5">
    <div class="mb-2">
      <h1 class="card-title text-2xl">Novo resíduo</h1>
    </div>
      <label class="form-control gap-2"><span class="label-text font-medium">Tipo de resíduo</span><input class="input input-bordered w-full" type="text" name="tipo" required></label>
      <label class="form-control gap-2"><span class="label-text font-medium">Dispositivo</span><input class="input input-bordered w-full" type="text" name="dispositivo" required></label>
      <label class="form-control gap-2"><span class="label-text font-medium">Descrição</span><input class="input input-bordered w-full"  name="descricao" required></label>
    
      <div class="card-actions justify-end"><a href="{{ url_for('residuo.get') }}" class="btn btn-ghost">Cancelar</a><button type="submit" class="btn btn-primary">Cadastrar residuo</button></div>
        
    </div>
  </div>
</form>

{% endblock %}
